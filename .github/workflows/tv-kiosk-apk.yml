# Baut die Welcome-App für die TV-Box (android-tv-kiosk).
# Auf main wird die APK als Release "tvbox" veröffentlicht, damit TV-Box-einrichten.bat sie
# unter einer festen Adresse herunterladen kann:
# https://github.com/germanbeast/RentalInvoice/releases/download/tvbox/beckhome-tv.apk
name: TV-Box-App bauen

on:
  push:
    paths:
      - 'android-tv-kiosk/**'
      - '.github/workflows/tv-kiosk-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-tv-kiosk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Gradle direkt (das gradlew-Skript im Ordner ist ein defektes Altstück)
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      # Fester Schlüssel für Selbst-Updates (Repository-Secrets TV_KEYSTORE_B64 + TV_KEYSTORE_PASSWORD)
      - name: Signierschlüssel bereitstellen
        env:
          TV_KEYSTORE_B64: ${{ secrets.TV_KEYSTORE_B64 }}
        run: |
          if [ -n "$TV_KEYSTORE_B64" ]; then
            echo "$TV_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/kiosk.keystore"
            echo "KIOSK_KEYSTORE=$RUNNER_TEMP/kiosk.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::Kein TV_KEYSTORE_B64-Secret: Build mit Debug-Schlüssel, Selbst-Update nicht möglich"
          fi

      - name: APK bauen
        env:
          KIOSK_KEYSTORE_PASSWORD: ${{ secrets.TV_KEYSTORE_PASSWORD }}
        run: |
          gradle --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk beckhome-tv.apk
          code=$(grep -oP 'versionCode\s+\K[0-9]+' app/build.gradle)
          name=$(grep -oP 'versionName\s+"\K[^"]+' app/build.gradle)
          sum=$(sha256sum beckhome-tv.apk | cut -d' ' -f1)
          printf '{"versionCode": %s, "versionName": "%s", "sha256": "%s"}\n' "$code" "$name" "$sum" > version.json
          cat version.json

      - uses: actions/upload-artifact@v4
        with:
          name: beckhome-tv-apk
          path: |
            android-tv-kiosk/beckhome-tv.apk
            android-tv-kiosk/version.json

      - name: Als Release "tvbox" veröffentlichen
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tvbox
          name: TV-Box-App (Welcome-Screen)
          body: Neueste Welcome-App für die TV-Box. Installieren mit TV-Box-einrichten.bat.
          make_latest: false
          files: |
            android-tv-kiosk/beckhome-tv.apk
            android-tv-kiosk/version.json
